<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel shelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.shelf::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e1015; color: #e8e9ee; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 6px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font: 800 18px Cinzel, serif; letter-spacing: .08em; color: #e2b85c">PRETTY DICE</span>
      <span style="font-size: 12px; color: #8b90a0">Ryan's bag · 6 designs</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; font: 600 13px Inter, sans-serif; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      All designs
    </button>
  </header>

  <section style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 0">
    <div role="group" aria-label="View" style="position: absolute; top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 210px; padding: 3px; background: #1d212c; border: 1px solid #262a36; border-radius: 999px">
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 0; background: #e2b85c; color: #1a1405; font: 600 13px Inter, sans-serif">Showcase</button>
      <button type="button" style="border: 0; border-radius: 999px; padding: 9px 0; background: transparent; color: #8b90a0; font: 600 13px Inter, sans-serif">Roll</button>
    </div>
    <svg viewBox="0 0 100 100" width="220" height="220" role="img" aria-label="{{active.name}} d20" style="margin-top: 40px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.55))">
      <defs><linearGradient id="gbig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{active.c3}}"></stop><stop offset="0.5" stop-color="{{active.c2}}"></stop><stop offset="1" stop-color="{{active.c1}}"></stop></linearGradient></defs>
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="url(#gbig)" stroke="{{active.c3}}" stroke-width="1" stroke-linejoin="round"></polygon>
      <polygon points="10,27 50,26 50,4" fill="rgba(255,255,255,.14)"></polygon>
      <polygon points="90,27 74,66 90,73" fill="rgba(0,0,0,.16)"></polygon>
      <polygon points="10,73 26,66 50,96" fill="rgba(0,0,0,.2)"></polygon>
      <polygon points="90,73 74,66 50,96" fill="rgba(0,0,0,.28)"></polygon>
      <g stroke="{{active.edge}}" stroke-width=".9" fill="none" stroke-linejoin="round"><polygon points="50,26 74,66 26,66"></polygon><path d="M50,4 L50,26 M10,27 L50,26 M90,27 L50,26 M10,27 L26,66 M90,27 L74,66 M10,73 L26,66 M90,73 L74,66 M50,96 L26,66 M50,96 L74,66"></path></g>
      <text x="50" y="58" text-anchor="middle" font-family="Cinzel, serif" font-weight="800" font-size="16" fill="{{active.paint}}">20</text>
    </svg>
    <div aria-hidden="true" style="width: 150px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(6px)"></div>
  </section>

  <section style="padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <h1 style="margin: 0; font: 700 22px Cinzel, serif; color: #e8e9ee">{{active.name}}</h1>
        <span style="font-size: 13px; color: #8b90a0">{{active.meta}}</span>
      </div>
      <span style="font-size: 12px; color: #8b90a0; white-space: nowrap">{{position}}</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex-grow: 1; height: 44px; border: 0; border-radius: 10px; background: #e2b85c; color: #1a1405; font: 600 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
        Edit look
      </button>
      <button type="button" aria-label="Duplicate design" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262a36; background: #1d212c; color: #e8e9ee; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
      <button type="button" aria-label="Rename design" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262a36; background: #1d212c; color: #e8e9ee; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2"></path><path d="M12 5v14"></path><path d="M9 19h6"></path></svg></button>
      <button type="button" aria-label="Delete design" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262a36; background: #1d212c; color: #e8e9ee; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg></button>
    </div>
  </section>

  <nav class="shelf" aria-label="Designs in the bag" style="display: flex; gap: 10px; padding: 6px 16px 14px; overflow-x: auto; scrollbar-width: none">
    <sc-for list="{{cards}}" as="item" hint-placeholder-count="6">
      <button type="button" onClick="{{item.pick}}" aria-label="{{item.name}}" style="position: relative; flex: none; width: 88px; height: 112px; border-radius: 14px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; cursor: pointer">
        <sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="position: absolute; inset: -1px; border-radius: 14px; border: 2px solid #e2b85c; background: rgba(226,184,92,.08)"></span>
        </sc-if>
        <svg viewBox="0 0 100 100" width="62" height="62" aria-hidden="true">
          <defs><linearGradient id="gc-{{item.id}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{item.c3}}"></stop><stop offset="0.5" stop-color="{{item.c2}}"></stop><stop offset="1" stop-color="{{item.c1}}"></stop></linearGradient></defs>
          <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="url(#gc-{{item.id}})" stroke="{{item.c3}}" stroke-width="1.5" stroke-linejoin="round"></polygon>
          <polygon points="90,73 74,66 50,96" fill="rgba(0,0,0,.28)"></polygon>
          <polygon points="10,73 26,66 50,96" fill="rgba(0,0,0,.18)"></polygon>
          <g stroke="{{item.edge}}" stroke-width="1.3" fill="none" stroke-linejoin="round"><polygon points="50,26 74,66 26,66"></polygon><path d="M10,27 L50,26 M90,27 L50,26 M10,27 L26,66 M90,27 L74,66 M50,96 L26,66 M50,96 L74,66"></path></g>
          <text x="50" y="58" text-anchor="middle" font-family="Cinzel, serif" font-weight="800" font-size="17" fill="{{item.paint}}">20</text>
        </svg>
        <span style="position: relative; font-size: 11px; line-height: 1.2; text-align: center; color: #e8e9ee; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{item.short}}</span>
      </button>
    </sc-for>
    <button type="button" aria-label="Add a design" style="flex: none; width: 88px; height: 112px; border-radius: 14px; border: 1px dashed #3a4052; background: transparent; color: #8b90a0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 11px Inter, sans-serif; cursor: pointer">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New
    </button>
  </nav>

  <footer style="display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 22px">
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Layout" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #262a36; background: rgba(20,23,31,.72); color: #e8e9ee; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
      <button type="button" aria-label="Sound off" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #262a36; background: rgba(20,23,31,.72); color: #8b90a0; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l4 6M21 9l-4 6"></path></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Info" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #262a36; background: rgba(20,23,31,.72); color: #e8e9ee; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
      <button type="button" aria-label="Roll" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e2b85c; background: rgba(20,23,31,.72); color: #e2b85c; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"></path><path d="M12 7l4.5 8h-9z"></path></svg></button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var designs = [
      { id: 'amethyst', name: 'Amethyst Swirl', short: 'Amethyst', meta: 'Swirl · Cinzel numbers · in 3 sets', c1: '#6f8fe8', c2: '#a784f5', c3: '#d8c4f5', paint: '#f4f1e8', edge: 'rgba(255,255,255,.4)' },
      { id: 'gold', name: "Dragon's Gold", short: "Dragon's Gold", meta: 'Metal · antique relief · in 2 sets', c1: '#7a5512', c2: '#c9962e', c3: '#f0d27a', paint: '#2a1a05', edge: 'rgba(60,35,0,.45)' },
      { id: 'bone', name: 'Old Bone', short: 'Old Bone', meta: 'Stone · inked numbers · in 1 set', c1: '#b3a07a', c2: '#d9cba9', c3: '#fff6e4', paint: '#3a2c1a', edge: 'rgba(80,60,30,.35)' },
      { id: 'obsidian', name: 'Obsidian Tide', short: 'Obsidian', meta: 'Epoxy · gold paint · in 2 sets', c1: '#1b1f2a', c2: '#3e5c76', c3: '#9fd3e6', paint: '#e2b85c', edge: 'rgba(160,220,240,.35)' },
      { id: 'jade', name: 'Jade Marble', short: 'Jade', meta: 'Marble · filigree · not in a set', c1: '#2f7d5b', c2: '#7cc39b', c3: '#e6f4ea', paint: '#f4f1e8', edge: 'rgba(255,255,255,.4)' },
      { id: 'ember', name: 'Ember Stone', short: 'Ember', meta: 'Stone · bold numbers · in 1 set', c1: '#7a2a1c', c2: '#d0643a', c3: '#f2b07a', paint: '#fff4e6', edge: 'rgba(255,230,200,.35)' }
    ];
    var activeId = (this.state && this.state.active) || 'amethyst';
    var self = this;
    var idx = 0;
    var cards = designs.map(function (d, i) {
      if (d.id === activeId) idx = i;
      return Object.assign({}, d, { selected: d.id === activeId, pick: function () { self.setState({ active: d.id }); } });
    });
    return { cards: cards, active: designs[idx], position: (idx + 1) + ' of ' + designs.length };
  }
}
</script>
</body>
</html>
