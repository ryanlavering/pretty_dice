<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character sets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pd-scroll::-webkit-scrollbar{display:none}
.pd-die,.pd-rest{position:absolute}
.pd-die{animation:pdDrop .95s cubic-bezier(.2,.75,.3,1) both}
.pd-rest{animation:pdSet .35s ease both}
.pd-result{animation:pdFade .3s ease .9s both}
@keyframes pdDrop{0%{transform:translate(var(--dx),-460px) rotate(var(--r0))}70%{transform:translate(0,8px) rotate(var(--r1))}100%{transform:translate(0,0) rotate(var(--r2))}}
@keyframes pdSet{from{opacity:0;transform:scale(.85) rotate(var(--r2))}to{opacity:1;transform:rotate(var(--r2))}}
@keyframes pdFade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e1015; color: #e8e9ee; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 16px 8px">
    <a href="BagSets.dc.html" style="height: 44px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; display: flex; align-items: center; gap: 4px; font: 600 13px Inter, sans-serif; text-decoration: none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Bag
    </a>
    <button type="button" aria-label="Switch character" style="flex-grow: 1; height: 44px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; display: flex; align-items: center; gap: 10px; cursor: pointer">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2a2619; color: #e2b85c; display: grid; place-items: center; font: 800 14px Cinzel, serif">V</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; flex-grow: 1">
        <span style="font: 600 14px Inter, sans-serif">Vex</span>
        <span style="font-size: 11px; color: #8b90a0">Warlock 5 · default d20: Dragon's Gold</span>
      </span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8b90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </header>

  <div aria-label="Stats" style="display: flex; gap: 6px; padding: 2px 16px 10px">
    <sc-for list="{{stats}}" as="st" hint-placeholder-count="5">
      <span style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; border: 1px solid #262a36; background: #161922">
        <span style="font: 600 10px Inter, sans-serif; letter-spacing: .1em; color: #8b90a0">{{st.k}}</span>
        <span style="font: 700 15px Inter, sans-serif">{{st.v}}</span>
      </span>
    </sc-for>
  </div>

  <div class="pd-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 16px">
    <h2 style="font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8b90a0; margin: 6px 16px 8px">Vex's sets</h2>
    <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{custom}}" as="s" hint-placeholder-count="3">
        <li style="display: flex; gap: 8px; align-items: center">
          <button type="button" onClick="{{s.open}}" aria-label="Open {{s.name}} on the roll mat" style="flex-grow: 1; min-width: 0; min-height: 66px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px 10px 14px; border-radius: 12px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; cursor: pointer">
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; flex-grow: 1; min-width: 0">
              <span style="font: 600 15px Inter, sans-serif">{{s.name}}</span>
              <span style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
                <sc-for list="{{s.chips}}" as="t" hint-placeholder-count="1">
                  <span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 4px; border-radius: 999px; background: #1d212c; border: 1px solid #262a36; font-size: 11px; color: #d4d6de">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><polygon points="8,1 14.5,4.5 14.5,11.5 8,15 1.5,11.5 1.5,4.5" fill="{{t.c2}}" stroke="{{t.c3}}" stroke-width="1.2"></polygon></svg>
                    {{t.label}}
                  </span>
                </sc-for>
                <span style="font-size: 12px; color: #8b90a0">{{s.mod}}</span>
              </span>
            </span>
            <sc-if value="{{s.hasQuick}}" hint-placeholder-val="{{false}}">
              <span style="flex: none; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; background: #2a2619; color: #e2b85c; font: 700 15px Inter, sans-serif; display: grid; place-items: center">{{s.quickTotal}}</span>
            </sc-if>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e2b85c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <button type="button" onClick="{{s.quick}}" aria-label="Quick roll {{s.name}} without leaving this screen" title="Quick roll here" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #262a36; background: #1d212c; color: #b9bdc9; display: grid; place-items: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
          </button>
        </li>
      </sc-for>
      <li><button type="button" style="width: 100%; height: 44px; border-radius: 12px; border: 1px dashed #3a4052; background: transparent; color: #8b90a0; font: 500 13px Inter, sans-serif; cursor: pointer">+ New set for Vex</button></li>
    </ul>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 18px 16px 8px">
      <h2 style="font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8b90a0; margin: 0">From Vex's sheet</h2>
      <button type="button" style="border: 0; background: transparent; color: #e2b85c; font: 600 12px Inter, sans-serif; padding: 10px 0; cursor: pointer">All 18 checks + 2 attacks</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{auto}}" as="s" hint-placeholder-count="4">
        <li style="display: flex; gap: 8px; align-items: center">
          <button type="button" onClick="{{s.open}}" aria-label="Open {{s.name}} on the roll mat" style="flex-grow: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px 8px 14px; border-radius: 12px; border: 1px solid #262a36; background: #13161e; color: #e8e9ee; cursor: pointer">
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-grow: 1; min-width: 0">
              <span style="display: flex; gap: 8px; align-items: center">
                <span style="font: 600 14px Inter, sans-serif">{{s.name}}</span>
                <span style="font: 700 9px Inter, sans-serif; letter-spacing: .08em; color: #8b90a0; border: 1px solid #3a4052; border-radius: 4px; padding: 1px 4px">{{s.kind}}</span>
              </span>
              <span style="font-size: 12px; color: #8b90a0">{{s.notation}}</span>
            </span>
            <sc-if value="{{s.hasQuick}}" hint-placeholder-val="{{false}}">
              <span style="flex: none; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; background: #2a2619; color: #e2b85c; font: 700 15px Inter, sans-serif; display: grid; place-items: center">{{s.quickTotal}}</span>
            </sc-if>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e2b85c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <button type="button" onClick="{{s.quick}}" aria-label="Quick roll {{s.name}} without leaving this screen" title="Quick roll here" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #262a36; background: #1d212c; color: #b9bdc9; display: grid; place-items: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>

    <h2 style="font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8b90a0; margin: 18px 16px 4px">Roll log</h2>
    <ol style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column">
      <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
        <li style="display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1d212c; font-size: 13px">
          <span style="flex: none; width: 34px; font: 700 15px Inter, sans-serif; color: #e2b85c; text-align: right">{{l.total}}</span>
          <span style="flex: none; font-weight: 600">{{l.name}}</span>
          <span style="flex-grow: 1; min-width: 0; color: #8b90a0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.detail}}</span>
        </li>
      </sc-for>
    </ol>
  </div>

  <sc-if value="{{stageOn}}" hint-placeholder-val="{{false}}">
    <section aria-label="Roll mat" style="position: absolute; inset: 0; background: #0e1015; display: flex; flex-direction: column">
      <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px; position: relative; z-index: 2">
        <button type="button" onClick="{{closeStage}}" style="height: 44px; padding: 0 14px 0 8px; border-radius: 999px; border: 1px solid #262a36; background: #161922; color: #e8e9ee; font: 600 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
          Vex
        </button>
        <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #2a2619; color: #e2b85c; font: 600 12px Inter, sans-serif; display: flex; align-items: center">{{stage.name}}</span>
      </header>
      <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 250px; bottom: 120px; border-radius: 22px; border: 1px solid #262a36; background: #12151c; box-shadow: inset 0 10px 40px rgba(0,0,0,.6)"></div>
      <sc-if value="{{stage.ready}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 0; right: 0; top: 104px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2">
          <span style="font: 700 24px Cinzel, serif; color: #e8e9ee">{{stage.name}}</span>
          <span style="font: 500 14px Inter, sans-serif; color: #8b90a0">{{stage.note}}</span>
        </div>
        <sc-for list="{{stage.readyDice}}" as="d" hint-placeholder-count="1">
          <div class="pd-rest" style="{{d.pos}}">
            <svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="{{d.label}}" style="filter: drop-shadow(0 10px 12px rgba(0,0,0,.6)); opacity: .9">
              <polygon points="{{d.pts}}" fill="{{d.c2}}" stroke="{{d.c3}}" stroke-width="3" stroke-linejoin="round"></polygon>
              <text x="50" y="{{d.ty}}" text-anchor="middle" font-family="Cinzel, serif" font-weight="800" font-size="{{d.fs}}" fill="{{d.paint}}">{{d.v}}</text>
            </svg>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{stage.rolled}}" hint-placeholder-val="{{false}}">
        <div class="pd-result" aria-live="polite" style="position: absolute; left: 0; right: 0; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2">
          <span style="{{stage.totalStyle}}">{{stage.total}}</span>
          <span style="font: 500 14px Inter, sans-serif; color: #8b90a0">{{stage.breakdown}}</span>
        </div>
        <sc-for list="{{stage.rolledDice}}" as="d" hint-placeholder-count="1">
          <div class="pd-die" style="{{d.pos}}">
            <svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="{{d.label}}" style="filter: drop-shadow(0 10px 12px rgba(0,0,0,.6))">
              <polygon points="{{d.pts}}" fill="{{d.c2}}" stroke="{{d.c3}}" stroke-width="3" stroke-linejoin="round"></polygon>
              <text x="50" y="{{d.ty}}" text-anchor="middle" font-family="Cinzel, serif" font-weight="800" font-size="{{d.fs}}" fill="{{d.paint}}">{{d.v}}</text>
            </svg>
          </div>
        </sc-for>
      </sc-if>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 8px">
        <button type="button" onClick="{{rollStage}}" style="flex-grow: 1; height: 52px; border: 0; border-radius: 12px; background: #e2b85c; color: #1a1405; font: 700 16px Inter, sans-serif; cursor: pointer">{{stage.rollLabel}}</button>
        <button type="button" onClick="{{closeStage}}" style="flex: none; padding: 0 18px; height: 52px; border-radius: 12px; border: 1px solid #262a36; background: #1d212c; color: #e8e9ee; font: 600 14px Inter, sans-serif; cursor: pointer">Done</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var D = {
      amethyst: { name: 'Amethyst', c2: '#a784f5', c3: '#d8c4f5', paint: '#f4f1e8' },
      obsidian: { name: 'Obsidian', c2: '#3e5c76', c3: '#9fd3e6', paint: '#e2b85c' },
      bone: { name: 'Old Bone', c2: '#d9cba9', c3: '#fff6e4', paint: '#3a2c1a' },
      ember: { name: 'Ember', c2: '#d0643a', c3: '#f2b07a', paint: '#fff4e6' },
      jade: { name: 'Jade', c2: '#7cc39b', c3: '#e6f4ea', paint: '#16402c' },
      gold: { name: "Dragon's Gold", c2: '#c9962e', c3: '#f0d27a', paint: '#2a1a05' }
    };
    var SH = {
      4: { pts: '50,8 94,88 6,88', ty: 74, fs: 26 },
      6: { pts: '14,14 86,14 86,86 14,86', ty: 61, fs: 30 },
      8: { pts: '50,4 94,50 50,96 6,50', ty: 60, fs: 28 },
      10: { pts: '50,4 92,42 50,96 8,42', ty: 56, fs: 26 },
      12: { pts: '50,5 95,38 78,92 22,92 5,38', ty: 66, fs: 28 },
      20: { pts: '50,4 90,27 90,73 50,96 10,73 10,27', ty: 61, fs: 28 }
    };
    var CUSTOM = [
      { id: 'eb-dmg', name: 'Eldritch blast · damage', terms: [{ n: 2, s: 10, d: 'obsidian' }], mods: [['CHA', 4]] },
      { id: 'hex', name: 'Hex', terms: [{ n: 1, s: 6, d: 'ember' }], mods: [] },
      { id: 'dagger', name: 'Dagger', terms: [{ n: 1, s: 4, d: 'bone' }, { n: 1, s: 6, d: 'ember' }], mods: [['DEX', 2]] }
    ];
    var AUTO = [
      { id: 'eb-hit', name: 'Eldritch blast · to hit', kind: 'ATTACK', terms: [{ n: 1, s: 20, d: 'gold' }], mods: [['CHA', 4], ['PROF', 3]] },
      { id: 'perception', name: 'Perception', kind: 'SKILL', terms: [{ n: 1, s: 20, d: 'gold' }], mods: [['WIS', 1]] },
      { id: 'deception', name: 'Deception', kind: 'SKILL', terms: [{ n: 1, s: 20, d: 'gold' }], mods: [['CHA', 4], ['PROF', 3]] },
      { id: 'wis-save', name: 'Wisdom save', kind: 'SAVE', terms: [{ n: 1, s: 20, d: 'gold' }], mods: [['WIS', 1], ['PROF', 3]] }
    ];
    var ALL = CUSTOM.concat(AUTO), byId = {};
    ALL.forEach(function (s) { byId[s.id] = s; });
    function modText(m) { return m.map(function (x) { return '+ ' + x[0] + ' ' + x[1]; }).join(' '); }
    function notation(s) { return s.terms.map(function (t) { return (t.n > 1 ? t.n : '') + 'd' + t.s; }).join(' + ') + (s.mods.length ? ' ' + modText(s.mods) : ''); }
    function roll(set, n) {
      var seed = (n * 2654435761 + set.id.length * 97 + set.id.charCodeAt(0) * 131) >>> 0;
      function r(m) { seed = (seed * 1664525 + 1013904223) >>> 0; return 1 + ((seed >>> 8) % m); }
      var dice = [];
      set.terms.forEach(function (t) { for (var k = 0; k < t.n; k++) dice.push({ s: t.s, d: t.d, v: r(t.s) }); });
      var mod = set.mods.reduce(function (a, m) { return a + m[1]; }, 0);
      var total = dice.reduce(function (a, x) { return a + x.v; }, 0) + mod;
      var breakdown = dice.map(function (x) { return 'd' + x.s + ' ' + x.v; }).join(' + ') + (set.mods.length ? ' ' + modText(set.mods) : '');
      var d20s = dice.filter(function (x) { return x.s === 20; });
      return { dice: dice, total: total, breakdown: breakdown, nat20: d20s.length === 1 && d20s[0].v === 20, nat1: d20s.length === 1 && d20s[0].v === 1 };
    }
    function layout(dice, salt, landed) {
      var n = dice.length, per = n <= 3 ? n : 3, size = n > 4 ? 70 : 84, gap = size + 22;
      return dice.map(function (x, k) {
        var row = Math.floor(k / per), col = k % per, m = Math.min(per, n - row * per);
        var startX = 195 - (m * gap - 22) / 2;
        var j1 = ((salt * 7 + k * 13 + (landed ? x.v * 5 : 0)) % 21) - 10;
        var j2 = ((salt * 11 + k * 17 + (landed ? x.v * 3 : 0)) % 25) - 12;
        var rot = ((salt * 29 + k * 41 + (landed ? x.v * 7 : 0)) % 40) - 20;
        var left = Math.round(startX + col * gap + j1), top = Math.round((n > 6 ? 296 : 340) + row * (size + 24) + j2);
        var sh = SH[x.s] || SH[20], d = D[x.d];
        return {
          v: x.v, pts: sh.pts, ty: sh.ty, fs: sh.fs, c2: d.c2, c3: d.c3, paint: d.paint,
          label: 'd' + x.s + ' ' + d.name + ' showing ' + x.v,
          pos: 'left: ' + left + 'px; top: ' + top + 'px; width: ' + size + 'px; height: ' + size + 'px; --dx: ' + ((k % 2 ? 1 : -1) * (50 + k * 18)) + 'px; --r0: ' + (rot - 540) + 'deg; --r1: ' + (rot + 30) + 'deg; --r2: ' + rot + 'deg; transform: rotate(' + rot + 'deg); animation-delay: ' + (landed ? k * 0.06 : k * 0.03) + 's'
        };
      });
    }
    var lastBy = st.lastBy || { 'eb-dmg': { total: 15, dice: [{ s: 10, d: 'obsidian', v: 6 }, { s: 10, d: 'obsidian', v: 5 }] } };
    var quickBy = st.quickBy || {};
    var log = st.log || [
      { total: 15, name: 'Eldritch blast · damage', detail: '2d10 (6, 5) + CHA 4' },
      { total: 21, name: 'Eldritch blast · to hit', detail: 'd20 14 + CHA 4 + PROF 3' },
      { total: 9, name: 'Perception', detail: 'd20 8 + WIS 1' }
    ];
    var n0 = st.n || 0;
    function record(set) {
      var n = n0 + 1, res = roll(set, n);
      var lb = Object.assign({}, lastBy); lb[set.id] = { total: res.total, dice: res.dice };
      return { n: n, res: res, lastBy: lb, log: [{ total: res.total, name: set.name, detail: res.breakdown }].concat(log).slice(0, 6) };
    }
    function open(id) {
      var set = byId[id], last = lastBy[id];
      var dice = last ? last.dice : roll(set, 999).dice;
      self.setState({ stage: { id: id, phase: 'ready', dice: dice, lastTotal: last ? last.total : null } });
    }
    function rollStage() {
      var sg = st.stage, set = byId[sg.id], rec = record(set);
      var next = { n: rec.n, lastBy: rec.lastBy, log: rec.log, stage: { id: sg.id, phase: 'rolled', dice: rec.res.dice, res: rec.res } };
      if (sg.phase === 'rolled') {
        self.setState({ stage: Object.assign({}, sg, { phase: 'ready' }) });
        setTimeout(function () { self.setState(next); }, 30);
      } else {
        self.setState(next);
      }
    }
    function quick(id) {
      var rec = record(byId[id]), q = Object.assign({}, quickBy); q[id] = rec.res.total;
      self.setState({ n: rec.n, lastBy: rec.lastBy, log: rec.log, quickBy: q });
    }
    function rowOf(s) {
      return {
        name: s.name, kind: s.kind || '', mod: modText(s.mods), notation: notation(s),
        chips: s.terms.map(function (t) { var d = D[t.d]; return { label: (t.n > 1 ? t.n : '') + 'd' + t.s + ' ' + d.name, c2: d.c2, c3: d.c3 }; }),
        hasQuick: quickBy[s.id] != null, quickTotal: quickBy[s.id],
        open: function () { open(s.id); }, quick: function () { quick(s.id); }
      };
    }
    var stage = { ready: false, rolled: false, name: '', note: '', readyDice: [], rolledDice: [], rollLabel: 'Roll' };
    if (st.stage) {
      var sg = st.stage, set = byId[sg.id], salt = sg.id.length * 7 + sg.id.charCodeAt(1);
      stage.name = set.name;
      stage.ready = sg.phase === 'ready';
      stage.rolled = sg.phase === 'rolled';
      stage.rollLabel = stage.rolled ? 'Roll again' : 'Roll';
      stage.note = sg.lastTotal != null ? 'Set out as your last roll (' + sg.lastTotal + ') · tap Roll or flick the dice' : 'Dice set out on the mat · tap Roll or flick the dice';
      if (stage.ready) stage.readyDice = layout(sg.dice, salt, false);
      if (stage.rolled) {
        var res = sg.res;
        stage.rolledDice = layout(res.dice, salt + (st.n || 0), true);
        stage.total = res.total;
        stage.breakdown = res.breakdown + (res.nat20 ? ' · natural 20' : (res.nat1 ? ' · natural 1' : ''));
        stage.totalStyle = 'font: 800 58px/1 Cinzel, serif; color: ' + (res.nat20 ? '#ffd24a; text-shadow: 0 0 22px #ff9d1a' : (res.nat1 ? '#8c919e' : '#e2b85c'));
      }
    }
    return {
      stats: [{ k: 'CHA', v: '+4' }, { k: 'DEX', v: '+2' }, { k: 'WIS', v: '+1' }, { k: 'CON', v: '+1' }, { k: 'PROF', v: '+3' }],
      custom: CUSTOM.map(rowOf),
      auto: AUTO.map(rowOf),
      log: log,
      stageOn: !!st.stage,
      stage: stage,
      rollStage: rollStage,
      closeStage: function () { self.setState({ stage: null }); }
    };
  }
}
</script>
