<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;800&family=Uncial+Antiqua&family=Metamorphous&display=swap">
<style>
  :root{--bg:#0e1015;--panel:#161922;--line:#262a36;--ink:#e8e9ee;--dim:#8b90a0;--accent:#e2b85c}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
  #app{display:flex;height:100%}
  aside{width:310px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;overflow:auto}
  h1{font:800 22px Cinzel,serif;letter-spacing:.08em;margin:0 0 2px;color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  button{font:inherit;color:var(--ink);background:#1d212c;border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  button:hover{border-color:#3a4052}
  button.on{border-color:var(--accent);background:#2a2619;color:var(--accent)}
  button.big{width:100%;padding:11px;font-weight:600;background:var(--accent);color:#1a1405;border:0;margin-top:6px}
  button.big.alt{background:#1d212c;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .row label{flex:1;color:var(--dim)}
  input[type=color]{width:44px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px;cursor:pointer}
  select{flex:1;font:inherit;color:var(--ink);background:#1d212c;border:1px solid var(--line);border-radius:6px;padding:6px}
  input[type=color]:disabled{opacity:.25}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .chk{display:flex;gap:8px;align-items:center;color:var(--dim);margin:6px 0;font-size:13px}
  #stage{flex:1;position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #stage canvas:active{cursor:grabbing}
  #result{position:absolute;top:46px;left:0;right:0;text-align:center;font:800 54px Cinzel,serif;color:var(--accent);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 18px #000}
  #result.on{opacity:1}
  #result .brk{font:500 14px Inter,sans-serif;color:var(--dim);letter-spacing:0;margin:4px auto 0;max-width:80%;text-shadow:0 1px 8px #000}
  #hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px;pointer-events:none}
  #name{position:absolute;top:16px;left:0;right:0;text-align:center;font:600 13px Cinzel,serif;letter-spacing:.18em;color:var(--dim);pointer-events:none}
  @media (max-width:760px){
    #app{flex-direction:column-reverse}
    aside{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>PRETTY DICE</h1>
    <div class="sub">Procedural polyhedral dice. Drag to turn, Space to randomize.</div>

    <h2>Shape</h2>
    <div class="grid" id="shapes"></div>

    <div id="customctl">
      <h2>Custom set</h2>
      <div class="row"><input id="notation" type="text" spellcheck="false" placeholder="4d6+2d10+3" style="flex:1;min-width:0;font:inherit;color:var(--ink);background:#1d212c;border:1px solid var(--line);border-radius:6px;padding:7px"><button id="notapply" style="padding:7px 10px;flex:none">Set</button></div>
      <div id="noterr" style="color:#e07a7a;font-size:12px;min-height:16px"></div>
      <div class="grid" id="steppers" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
      <div class="row"><label>Modifier</label><button id="modm" style="padding:4px 10px">−</button><b id="modv" style="min-width:26px;text-align:center">0</b><button id="modp" style="padding:4px 10px">+</button></div>
    </div>

    <h2>Substrate</h2>
    <div class="grid two" id="subs"></div>

    <h2>Colors</h2>
    <div class="row"><label>Base</label><input type="color" id="c1"><input type="color" id="c2"><input type="color" id="c3"></div>
    <div class="row"><label>Number paint</label><input type="color" id="paint"></div>
    <div class="row"><label>Paint mode</label><select id="paintmode"><option value="auto">Auto (contrast + harmony)</option><option value="random">Random</option><option value="custom">Custom</option></select></div>
    <div class="row"><label>Swirl scale</label><input type="range" id="scale" min="0.5" max="3.5" step="0.05"></div>
    <div class="row"><label>Edge radius</label><input type="range" id="radius" min="0" max="0.15" step="0.005"></div>
    <div class="row"><label>Finish</label><input type="range" id="polish" min="0" max="1" step="0.01" title="matte ← → gloss"></div>
    <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin:-4px 0 4px 96px"><span>matte</span><span>gloss</span></div>

    <div id="stonectl"><h2>Stone</h2>
      <div class="row"><label>Type</label><select id="stone"></select></div>
      <div class="row"><label>Accent</label><input type="range" id="accent" min="0" max="1" step="0.01"></div>
    </div>
    <div id="epoxyctl"><h2>Epoxy</h2>
      <div class="row"><label>Glitter</label><input type="range" id="glitter" min="0" max="1" step="0.01"></div>
      <div class="row"><label>Bubbles</label><input type="range" id="bubbles" min="0" max="1" step="0.01"></div>
      <div class="row"><label>Clarity</label><input type="range" id="clarity" min="0.2" max="1" step="0.01"></div>
      <div class="row"><label>Inclusion</label><select id="incl"><option value="none">None</option><option value="duck">Rubber duck</option><option value="custom">Custom model…</option></select></div>
      <div id="inclctl">
        <div class="row"><button id="loadmodel" style="flex:1">Load model file (glb, obj, stl)…</button></div>
        <input type="file" id="modelfile" accept=".glb,.gltf,.obj,.stl" hidden>
        <div class="row"><label>Size</label><input type="range" id="inclsize" min="0.15" max="0.9" step="0.01"></div>
        <div class="row"><label>Turn</label><input type="range" id="inclturn" min="-180" max="180" step="1"></div>
        <div class="row"><label>Height</label><input type="range" id="inclheight" min="-0.6" max="0.6" step="0.01"></div>
      </div>
    </div>

    <h2>Numbers</h2>
    <div class="row"><label>Font</label><select id="font"></select></div>
    <div class="row"><label>Size</label><input type="range" id="numsize" min="0.3" max="1" step="0.01"></div>
    <div class="row"><label>Rotation</label><input type="range" id="numrot" min="-180" max="180" step="1"><output id="numrotv" style="width:38px;text-align:right;color:var(--dim)"></output></div>
    <div class="row"><label>Depth</label><input type="range" id="numdepth" min="0" max="6" step="0.1"></div>
    <div class="row"><label>Edge softness</label><input type="range" id="numsoft" min="0.5" max="10" step="0.1"></div>

    <h2>Generate</h2>
    <div class="chk"><input type="checkbox" id="randsub" checked><span>Randomize substrate too</span></div>
    <div class="chk"><input type="checkbox" id="randshape"><span>Randomize shape too</span></div>
    <div class="row"><label>Spin speed</label><input type="range" id="spin" min="0" max="1" step="0.01"></div>
    <div class="grid two" style="margin-bottom:6px"><button id="undo" title="Ctrl+Z">↶ Undo</button><button id="redo" title="Ctrl+Shift+Z / Ctrl+Y">Redo ↷</button></div>
    <button class="big" id="rand">Randomize</button>
    <button class="big alt" id="roll">Roll</button>
    <button class="big alt" id="back" hidden>Back to showcase</button>
    <div class="row"><label>Bounciness</label><input type="range" id="bounce" min="0" max="0.8" step="0.02"></div>

    <h2>Export</h2>
    <div class="row"><label>Size</label><select id="expsize"><option value="0">Current view</option><option value="1024">1024 px</option><option value="2048" selected>2048 px</option><option value="4096">4096 px</option></select></div>
    <div class="grid two"><button id="exppng">PNG</button><button id="expjpg">JPG</button></div>
    <div class="grid two" style="margin-top:6px"><button id="savejson">Save design</button><button id="loadjson">Load design</button></div>
    <input type="file" id="jsonfile" accept=".json,application/json" hidden>
    <h2>Settings</h2>
    <button id="reset" style="width:100%">Reset to defaults</button>
  </aside>
  <div id="stage"><div id="name"></div><div id="result"></div><div id="hint"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

/* ---------- utils ---------- */
const mulberry32 = a => () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const pick = (arr, r) => arr[Math.floor(r()*arr.length)];
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);
const PHI = (1+Math.sqrt(5))/2;
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const signs = (x,y,z) => { const o=[]; for(const a of [1,-1]) for(const b of [1,-1]) for(const c of [1,-1]) o.push(V(a*x,b*y,c*z)); return o; };

/* ---------- polyhedra: vertex sets -> hull -> merged coplanar faces ---------- */
const trapezohedron = n => {           // d10 (n=5), d14 (n=7)
  const H=1, c=Math.cos(Math.PI/n), t=H*(1-c)/(1+c), v=[V(0,H,0),V(0,-H,0)];
  for(let k=0;k<2*n;k++){const a=k*Math.PI/n; v.push(V(Math.cos(a),k%2?-t:t,Math.sin(a)));}
  return v;
};
const dipyramid = (n,h) => { const v=[V(0,h,0),V(0,-h,0)]; for(let k=0;k<n;k++){const a=2*Math.PI*k/n; v.push(V(Math.cos(a),0,Math.sin(a)));} return v; };
const SHAPES = {
  d4:  {label:'d4',  verts:()=>[V(1,1,1),V(1,-1,-1),V(-1,1,-1),V(-1,-1,1)], labels:range(1,4)},
  d6:  {label:'d6',  verts:()=>signs(1,1,1), labels:range(1,6)},
  d8:  {label:'d8',  verts:()=>[V(1,0,0),V(-1,0,0),V(0,1,0),V(0,-1,0),V(0,0,1),V(0,0,-1)], labels:range(1,8)},
  d10: {label:'d10', verts:()=>trapezohedron(5), labels:range(0,9)},
  d100:{label:'d%',  pair:true},
  d12: {label:'d12', verts:()=>{const i=1/PHI,o=signs(1,1,1);
        for(const a of [1,-1])for(const b of [1,-1]){o.push(V(0,a*i,b*PHI),V(a*i,b*PHI,0),V(b*PHI,0,a*i));} return o;}, labels:range(1,12)},
  d20: {label:'d20', verts:()=>{const o=[];
        for(const a of [1,-1])for(const b of [1,-1]){o.push(V(0,a,b*PHI),V(a,b*PHI,0),V(b*PHI,0,a));} return o;}, labels:range(1,20)},
  d14: {label:'d14', verts:()=>trapezohedron(7), labels:range(1,14)},
  d16: {label:'d16', verts:()=>dipyramid(8,0.9), labels:range(1,16)},
  set7:{label:'Standard 7', set:true},
  custom:{label:'Custom set', set:true},
  rd12:{label:'rhombic d12', verts:()=>{const o=signs(1,1,1); for(const s of [2,-2]) o.push(V(s,0,0),V(0,s,0),V(0,0,s)); return o;}, labels:range(1,12)},
};

function hull(verts){
  const eps=1e-4, n=verts.length, out=[], seen=new Set();
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++){
    const nr=new THREE.Vector3().subVectors(verts[j],verts[i]).cross(new THREE.Vector3().subVectors(verts[k],verts[i]));
    if(nr.lengthSq()<1e-12) continue; nr.normalize();
    let d=nr.dot(verts[i]), pos=0, neg=0;
    for(const v of verts){const s=nr.dot(v)-d; if(s>eps)pos++; else if(s<-eps)neg++;}
    if(pos&&neg) continue;
    if(pos){nr.negate(); d=-d;}
    const idx=[]; verts.forEach((v,m)=>{if(Math.abs(nr.dot(v)-d)<=eps) idx.push(m);});
    const key=idx.join(','); if(seen.has(key)) continue; seen.add(key);
    const c=new THREE.Vector3(); idx.forEach(m=>c.add(verts[m])); c.multiplyScalar(1/idx.length);
    const e1=new THREE.Vector3().subVectors(verts[idx[0]],c).normalize(), e2=new THREE.Vector3().crossVectors(nr,e1);
    idx.sort((a,b)=>{const pa=new THREE.Vector3().subVectors(verts[a],c),pb=new THREE.Vector3().subVectors(verts[b],c);
      return Math.atan2(pa.dot(e2),pa.dot(e1))-Math.atan2(pb.dot(e2),pb.dot(e1));});
    out.push({n:nr, d, idx:[...idx], pts:idx.map(m=>verts[m].clone())});
  }
  return out;
}

function assignLabels(faces, labels, rng){
  const N=faces.length, out=Array(N).fill(null); let lo=0, hi=N-1;
  for(let i=0;i<N;i++){
    if(out[i]!==null) continue;
    const j=faces.findIndex((f,m)=>m!==i&&out[m]===null&&f.n.dot(faces[i].n)<-0.999);
    if(j>=0){out[i]=labels[lo++]; out[j]=labels[hi--];} else out[i]=labels[lo++];
  }
  return out;
}

/* ---------- number atlas (bump + paint mask) ---------- */
const FONTS={ cinzel:{label:'Cinzel (classic)',css:'Cinzel,Georgia,serif',load:'700 100px Cinzel'}, metamorphous:{label:'Metamorphous (fantasy)',css:'Metamorphous,Georgia,serif',load:'400 100px Metamorphous'},
  uncial:{label:'Uncial Antiqua (runic)',css:'"Uncial Antiqua",Georgia,serif',load:'400 100px "Uncial Antiqua"'}, inter:{label:'Inter (clean sans)',css:'Inter,Arial,sans-serif',load:'800 100px Inter'},
  georgia:{label:'Georgia (serif)',css:'Georgia,serif',load:null}, mono:{label:'Courier (mono)',css:'"Courier New",monospace',load:null} };
function makeAtlas(N, labels, fontKey, soft, pad2){      // pad2: percentile (tens) die prints 00, 10 ... 90
  const cols=Math.ceil(Math.sqrt(N)), rows=Math.ceil(N/cols), cell=256, F=FONTS[fontKey]||FONTS.cinzel;
  const mk=(bg)=>{const c=document.createElement('canvas'); c.width=cols*cell; c.height=rows*cell; const g=c.getContext('2d'); g.fillStyle=bg; g.fillRect(0,0,c.width,c.height); return [c,g];};
  const [bc,bg]=mk('#fff'), [mc,mg]=mk('#000'), info=[];
  const show=l=>pad2?String(l).padStart(2,'0'):String(l), px=labels.some(l=>show(l).length>1)?112:136, weight=fontKey==='inter'?800:fontKey==='cinzel'?700:600;
  labels.forEach((lab,i)=>{
    let txt=show(lab); if(!pad2&&(lab===6||lab===9)) txt+='.';
    const cx=(i%cols+.5)*cell, cy=(Math.floor(i/cols)+.5)*cell;
    mg.font=`${weight} ${px}px ${F.css}`; mg.textAlign='center'; const m=mg.measureText(txt);   // align must be set before measuring or the first label is off-centre
    const w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight, h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
    info.push({halfDiag:Math.hypot(w,h)/2});            // text box half-diagonal in atlas px, used to fit it inside the face
    for(const [g,fill,blur] of [[bg,'#000',soft],[mg,'#fff',0.6]]){
      g.font=`${weight} ${px}px ${F.css}`; g.textAlign='center'; g.fillStyle=fill; g.filter=blur?`blur(${blur}px)`:'none';
      g.fillText(txt,cx+(m.actualBoundingBoxLeft-m.actualBoundingBoxRight)/2,cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2);
      g.filter='none';
    }
  });
  const tex=c=>{const t=new THREE.CanvasTexture(c); t.anisotropy=8; return t;};
  return {bump:tex(bc), mask:tex(mc), cols, rows, cell, info};
}

/* ---------- geometry: flat numbered faces + (optional) rounded edge strips and vertex patches ---------- */
const slerp=(a,b,t)=>{const th=Math.acos(THREE.MathUtils.clamp(a.dot(b),-1,1)); if(th<1e-6) return a.clone();
  return a.clone().multiplyScalar(Math.sin((1-t)*th)).addScaledVector(b,Math.sin(t*th)).multiplyScalar(1/Math.sin(th));};

function buildGeometry(faces, atlas, radius, numSize, numRot){
  const pos=[],nor=[],uv=[],cb=[];
  let curCell=[0,0,1,1];
  const maxHD=Math.max(...atlas.info.map(i=>i.halfDiag));   // one scale for every label so 8 and 10 print at the same size
  const push=(p,n,u,v)=>{pos.push(p.x,p.y,p.z); nor.push(n.x,n.y,n.z); uv.push(u,v); cb.push(...curCell);};
  let R=0, SV=null;                                   // R: clamped radius, SV: shrunk vertex per original vertex id
  if(radius>0){
    R=Math.min(radius, 0.3*Math.min(...faces.map(f=>f.d)));
    const byV=new Map(); faces.forEach(f=>f.idx.forEach(v=>{if(!byV.has(v))byV.set(v,[]); byV.get(v).push(f);}));
    SV=new Map();
    for(const [v,fs] of byV){
      const A=new THREE.Matrix3().set(0,0,0,0,0,0,0,0,0), b=new THREE.Vector3(), e=A.elements;
      for(const f of fs){ const n=f.n, q=[n.x,n.y,n.z];
        for(let r=0;r<3;r++)for(let c=0;c<3;c++) e[c*3+r]+=q[r]*q[c];
        b.addScaledVector(n,f.d-R); }
      SV.set(v,{p:b.applyMatrix3(A.invert()), fs});
    }
    faces=faces.map(f=>({...f, pts:f.idx.map(v=>SV.get(v).p.clone().addScaledVector(f.n,R))}));
  }
  // flat faces
  faces.forEach((f,i)=>{
    const P=f.pts, n=f.n, m=P.length, p0=P[0], C=new THREE.Vector3(); let A=0;
    for(let k=1;k<m-1;k++){const a=new THREE.Vector3().subVectors(P[k],p0).cross(new THREE.Vector3().subVectors(P[k+1],p0)).length();
      C.add(new THREE.Vector3().add(p0).add(P[k]).add(P[k+1]).multiplyScalar(a/3)); A+=a;}
    C.multiplyScalar(1/A);
    let far=P[0]; P.forEach(p=>{if(p.distanceTo(C)>far.distanceTo(C)+1e-6) far=p;});
    const equi=P.every(p=>Math.abs(p.distanceTo(C)-far.distanceTo(C))<1e-4*far.distanceTo(C)+1e-6);
    const up=new THREE.Vector3().subVectors(far,C).normalize();
    if(m===4&&equi){ up.copy(new THREE.Vector3().subVectors(P[1],P[0]).cross(n).normalize()); }   // squares: edge-aligned, like real d6 pips
    up.applyAxisAngle(n,THREE.MathUtils.degToRad(numRot));
    const right=new THREE.Vector3().crossVectors(up,n);
    let r=1e9; for(let k=0;k<m;k++){const a=P[k],b=P[(k+1)%m],o=new THREE.Vector3().subVectors(b,a).cross(n).normalize();
      r=Math.min(r,-new THREE.Vector3().subVectors(C,a).dot(o));}
    const col=i%atlas.cols, row=Math.floor(i/atlas.cols), cu=(col+.5)/atlas.cols, cv=1-(row+.5)/atlas.rows;
    const opx=numSize*r/maxHD;                       // object units per atlas pixel: text box fits numSize * inradius
    curCell=[col/atlas.cols,1-(row+1)/atlas.rows,(col+1)/atlas.cols,1-row/atlas.rows];
    const put=p=>{const d=new THREE.Vector3().subVectors(p,C); push(p,n,cu+d.dot(right)/opx/(atlas.cols*atlas.cell), cv+d.dot(up)/opx/(atlas.rows*atlas.cell));};
    for(let k=0;k<m;k++){put(C);put(P[k]);put(P[(k+1)%m]);}
  });
  curCell=[0,0,1,1];
  if(R>0){
    const BU=.001, BV=.999;                           // blank atlas corner: no paint, no bump
    const tri=(p0,n0,p1,n1,p2,n2)=>{ const c=new THREE.Vector3().subVectors(p1,p0).cross(new THREE.Vector3().subVectors(p2,p0));
      const avg=n0.clone().add(n1).add(n2); if(c.dot(avg)<0){[p1,p2]=[p2,p1];[n1,n2]=[n2,n1];}
      push(p0,n0,BU,BV);push(p1,n1,BU,BV);push(p2,n2,BU,BV); };
    const S=8, L=3, at=(v,n)=>SV.get(v).p.clone().addScaledVector(n,R);
    // edge strips
    const edges=new Map();
    faces.forEach(f=>f.idx.forEach((v,k)=>{const w=f.idx[(k+1)%f.idx.length], key=Math.min(v,w)+'_'+Math.max(v,w);
      if(!edges.has(key)) edges.set(key,{v,w,fs:[]}); edges.get(key).fs.push(f);}));
    for(const {v,w,fs} of edges.values()){ if(fs.length!==2) continue;

/* ---------- interaction: drag-rotate with inertia, roll with a bounce ---------- */
const angVel=new THREE.Vector3(0,.5,0.08); let dragging=false, last=null;
const cv=renderer.domElement;
const orbit={az:0,el:0}; if(new URLSearchParams(location.search).get('zoom')) state.zoom=+new URLSearchParams(location.search).get('zoom');; let orbiting=false;      // right-drag orbits the camera; left-drag turns the dice
cv.addEventListener('contextmenu',e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{ if(e.button===2){ orbiting=true; last=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); return; }
  if(rolling||e.button!==0) return; dragging=true; last=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',()=>{dragging=false; orbiting=false;});
cv.addEventListener('pointermove',e=>{
  if(orbiting){ const dx=e.clientX-last[0], dy=e.clientY-last[1]; last=[e.clientX,e.clientY]; orbit.az-=dx*.006; orbit.el=THREE.MathUtils.clamp(orbit.el+dy*.006,-1.4,1.4); return; }
  if(!dragging) return;
  const dx=e.clientX-last[0], dy=e.clientY-last[1]; last=[e.clientX,e.clientY];
  const ax=new THREE.Vector3(dy,dx,0), len=ax.length(); if(!len) return;
  spinBy(new THREE.Quaternion().setFromAxisAngle(ax.normalize(),len*.012));
  angVel.copy(ax).multiplyScalar(len*.9); });
cv.addEventListener('wheel',e=>{e.preventDefault(); state.zoom=THREE.MathUtils.clamp(state.zoom*(1+e.deltaY*.001),.35,2.4); save();},{passive:false});
function spinBy(q){ if(isMulti()) dice.forEach(d=>d.mesh.quaternion.premultiply(q)); else rig.quaternion.premultiply(q); }

new ResizeObserver(resize).observe(stage); resize();

/* ---------- physics roll (cannon-es) ---------- */
let world=null, bodies=[], rolling=false, rollT=0, restT=0, settled=false, retries=0, camBlend=0;
const ROLL_CAM={y:6.2,z:7.6};
function startRoll(){
  if(!dice.length) return;
  const wasRolling=rolling; rolling=true; settled=false; rollT=0; restT=0; retries=0; $('result').classList.remove('on'); $('back').hidden=false;
  const poses=dice.map(d=>{const p=new THREE.Vector3(),q=new THREE.Quaternion(); d.mesh.getWorldPosition(p); d.mesh.getWorldQuaternion(q); return {p,q};});
  rig.position.set(0,0,0); rig.quaternion.identity();
  const nD=dice.length, k=nD>2?1.5+Math.max(0,nD-7)*.15:1; ROLL_CAM.y=6.2*k; ROLL_CAM.z=7.6*k; table.scale.setScalar(k);
  Object.assign(key.shadow.camera,{left:-7.3*k,right:7.3*k,top:7.3*k,bottom:-7.3*k,far:20+10*k}); key.shadow.camera.updateProjectionMatrix();   // bigger tray + farther camera for sets
  const dist=Math.hypot(ROLL_CAM.y,ROLL_CAM.z), halfW=THREE.MathUtils.clamp(Math.tan(THREE.MathUtils.degToRad(16))*dist*camera.aspect*.8,1.4,3.2*k), halfD=1.9*k;
  world=new CANNON.World({gravity:new CANNON.Vec3(0,-34,0)}); world.allowSleep=true;
  world.defaultContactMaterial.friction=.4; world.defaultContactMaterial.restitution=state.bounce;
  const plane=(pos,eul)=>{const b=new CANNON.Body({mass:0,shape:new CANNON.Plane()}); b.position.set(...pos); b.quaternion.setFromEuler(...eul); world.addBody(b);};
  plane([0,TABLE_Y,0],[-Math.PI/2,0,0]); plane([halfW,0,0],[0,-Math.PI/2,0]); plane([-halfW,0,0],[0,Math.PI/2,0]);
  plane([0,0,halfD],[0,Math.PI,0]); plane([0,0,-halfD],[0,0,0]);
  bodies=dice.map((d,i)=>{
    const b=new CANNON.Body({mass:1, linearDamping:.04, angularDamping:.1, sleepSpeedLimit:.25, sleepTimeLimit:.5,
      shape:new CANNON.ConvexPolyhedron({vertices:d.verts.map(v=>new CANNON.Vec3(v.x,v.y,v.z)), faces:d.faces.map(f=>[...f.idx])})});
    const {p,q}=poses[i]; d.mesh.position.copy(p); d.mesh.quaternion.copy(q);
    const n=dice.length, R=()=>Math.random()-.5;
    if(n>2){ const cols=Math.min(n,Math.max(3,Math.round(2*halfW/2.2))), rows=Math.ceil(n/cols), col=i%cols, row=Math.floor(i/cols);
      b.position.set(-halfW+1+col*(2*halfW-2)/Math.max(1,cols-1), TABLE_Y+2+row*1.8+i*.35, -halfD+1+row*(2*halfD-2)/Math.max(1,rows-1)); }
    else b.position.set(THREE.MathUtils.clamp(p.x,-halfW+1.2,halfW-1.2),Math.max(p.y,TABLE_Y+1.6),p.z);
    b.quaternion.set(q.x,q.y,q.z,q.w);
    if(n>2) b.velocity.set(-b.position.x*.5+R()*3, 3+Math.random()*3, R()*3);
    else b.velocity.set(R()*9+(i?2:-2), 7+Math.random()*4, R()*6-1);
    b.angularVelocity.set(R()*40,R()*40,R()*40);
    world.addBody(b); return b;});
}
function exitRoll(instant){
  if(!rolling&&!instant) return;
  rolling=false; world=null; bodies=[]; $('result').classList.remove('on'); $('back').hidden=true;
  dice.forEach(d=>{d.mesh.position.set(d.x,d.y,0); d.mesh.quaternion.identity();});
  rig.position.set(0,0,0); if(!instant) rig.quaternion.identity();
}
function readResult(){
  let total=0, parts=[];
  dice.forEach((d,i)=>{
    const q=new THREE.Quaternion(bodies[i].quaternion.x,bodies[i].quaternion.y,bodies[i].quaternion.z,bodies[i].quaternion.w);
    const four=d.faces.length===4; let best=0, bv=four?1e9:-1e9;
    d.faces.forEach((f,k)=>{const y=f.n.clone().applyQuaternion(q).y; if(four?y<bv:y>bv){bv=y;best=k;}});
    parts.push({label:d.labs[best], flat:Math.abs(bv)});
  });
  return parts;
}
function restCheck(dt){   // own rest detection: cannon's sleep can hover in 'sleepy' for rounded-ish dice
  const still=bodies.every(b=>b.velocity.lengthSquared()<.1&&b.angularVelocity.lengthSquared()<.5&&b.position.y<TABLE_Y+2.4);
  restT=still?restT+dt:Math.max(0,restT-dt*.5); return restT>.5;
}
function finishRoll(){ restT=0;

  if(bad.some(Boolean) && retries<8){ retries++;
    bodies.forEach((b,i)=>{ if(!bad[i]) return; b.wakeUp(); b.velocity.set(-b.position.x*1.2+(Math.random()-.5)*5,5,-b.position.z*1.2+(Math.random()-.5)*4);
      b.angularVelocity.set((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14); }); return; }

  const fmt=(d,p)=> d.name==='d10'&&p.label===0 ? 10 : d.name==='d%' ? String(p.label).padStart(2,'0') : p.label;

  }
  else if(state.shape==='set7'){ main=parts.map((p,i)=>fmt(dice[i],p)).join(' · '); sub=dice.map(d=>d.name).join('  ·  '); }   // sub line labels each value
  else if(SHAPES[state.shape].pair){ const t=parts[0].label+parts[1].label; main=String(t===0?100:t); }
  else main=String(fmt(dice[0],parts[0]));
  const R=$('result'); R.textContent=''; const m=document.createElement('div'); m.textContent=main; m.style.fontSize=state.shape==='set7'?'30px':''; R.append(m);
  if(sub){ const d2=document.createElement('div'); d2.className='brk'; d2.textContent=sub; R.append(d2); }

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  if(!dragging&&!rolling){
    const idle = new THREE.Vector3(.12,.55,.05).multiplyScalar(state.spin*1.5);
    angVel.copy(idle).add(angVel.clone().sub(idle).multiplyScalar(Math.exp(-dt*1.6)));
    const a=angVel.length()*dt; if(a>1e-6) spinBy(new THREE.Quaternion().setFromAxisAngle(angVel.clone().normalize(),a));
  }

    if(rollT>5) bodies.forEach(b=>b.angularDamping=.6);
    dice.forEach((d,i)=>{d.mesh.position.copy(bodies[i].position); d.mesh.quaternion.copy(bodies[i].quaternion);});
    if(!settled && rollT>.6 && restCheck(dt)) finishRoll();
  }
  camBlend+=((rolling?1:0)-camBlend)*(1-Math.exp(-dt*3));
  { const tgt=new THREE.Vector3(0,-camBlend,0), off=new THREE.Vector3(0,camBlend*ROLL_CAM.y*state.zoom,THREE.MathUtils.lerp(Math.max(baseZ,needHalfW/(Math.tan(THREE.MathUtils.degToRad(16))*camera.aspect)),ROLL_CAM.z,camBlend)*state.zoom).sub(tgt);   // zoom applies in both views
    const r=off.length(), th=Math.atan2(off.x,off.z)+orbit.az, ph=THREE.MathUtils.clamp(Math.asin(off.y/r)+orbit.el,rolling||camBlend>.5?.12:-1.4,1.4);
    camera.position.set(tgt.x+r*Math.cos(ph)*Math.sin(th),tgt.y+r*Math.sin(ph),tgt.z+r*Math.cos(ph)*Math.cos(th)); camera.lookAt(tgt); }
  table.visible=camBlend>.01; table.material.opacity=camBlend;
  renderer.render(scene,camera);
});

{ const q=new URLSearchParams(location.search); if(q.get('notation')&&!parseNotation(q.get('notation')).error) state.notation=q.get('notation'); if(q.get('orbit')){ const [a,b]=q.get('orbit').split(',').map(Number); orbit.az=a||0; orbit.el=b||0; } if(SHAPES[q.get('shape')]) state.shape=q.get('shape'); if(q.get('radius')) state.radius=+q.get('radius'); if(q.get('clarity')) state.clarity=+q.get('clarity'); if(q.get('incl')==='duck') state.inclusion='duck'; if(STONES[q.get("stone")]) state.stone=q.get("stone"); if(q.get("polish")) state.polish=+q.get("polish");

    labs.forEach((l,i)=>{ const cx=(i%at.cols)*at.cell, cy=Math.floor(i/at.cols)*at.cell, d=g.getImageData(cx,cy,at.cell,at.cell).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
