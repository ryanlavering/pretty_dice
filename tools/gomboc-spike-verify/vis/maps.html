<!doctype html><html><head><meta charset="utf-8"><title>gomboc h(u) maps</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script><style>html,body{margin:0;background:#10131a}</style></head><body>
<script type="module">
import * as THREE from 'three';
const ramp=(t,stops)=>{ t=Math.max(0,Math.min(1,t)); const k=t*(stops.length-1), i=Math.min(stops.length-2,Math.floor(k)), f=k-i; return stops[i].map((v,q)=>v+(stops[i+1][q]-v)*f); };
const PAGE=[[.15,.35,.95],[.55,.55,.55],[.95,.35,.15]]; // blue (low) -> red (high), like the spike page's distance colouring
const GRAD=[[.02,.02,.2],[.4,.1,.5],[.9,.35,.2],[.99,.9,.4]], DEPTH=[[.1,.8,.3],[.9,.9,.2],[.9,.3,.2],[.4,.05,.4]];
const PAL=[[.12,.47,.71],[1,.5,.05],[.17,.63,.17],[.84,.15,.16],[.58,.4,.74],[.55,.34,.29]];
function colors(D,ch){ const n=D.V.length, out=new Float32Array(3*n); for(let i=0;i<n;i++){ let c;
  if(ch==='h') c=ramp((D.h[i]-D.hmin)/(D.hmax-D.hmin),PAGE);
  else if(ch==='grad') c=ramp(D.g[i]/D.gmax,GRAD);
  else if(ch==='flow'){ if(D.depth){ c=ramp(D.depth[i]/Math.max(1,D.maxDepth),DEPTH); } else { const b=D.basin[i]; const t=(D.h[i]-D.hmin)/(D.hmax-D.hmin); c=PAL[b%PAL.length].map(v=>v*(0.55+0.45*(1-t))); } }
  out.set(c,3*i); } return out; }
function marks(D){ const m=[]; for(const c of D.crit.stable) m.push([c.u,'#22dd44','S']); for(const c of D.crit.unstable) m.push([c.u,'#ff2020','U']); for(const c of D.crit.saddle) m.push([c.u,'#ffe030','H']); return m; }
export function equirect(D,ch,W=1000){ const Hh=W/2, c=document.createElement('canvas'); c.width=W; c.height=Hh+50; const g=c.getContext('2d'); g.fillStyle='#10131a'; g.fillRect(0,0,c.width,c.height); const col=colors(D,ch); const ll=u=>[Math.atan2(u[1],u[0]),Math.asin(Math.max(-1,Math.min(1,u[2])))]; const X=l=>(l+Math.PI)/(2*Math.PI)*W, Y=p=>50+(Math.PI/2-p)/Math.PI*Hh;
  for(const t of D.T){ const P=t.map(i=>ll(D.V[i])); const xs=P.map(p=>p[0]); const wrap=Math.max(...xs)-Math.min(...xs)>Math.PI; const k=(t.reduce((s,i)=>s+0,0)); const cc=[0,1,2].map(q=>t.reduce((s,i)=>s+col[3*i+q],0)/3); g.fillStyle=`rgb(${cc.map(v=>Math.round(255*v)).join(',')})`; g.strokeStyle=g.fillStyle; g.lineWidth=0.6;
    for(const off of wrap?[0,1]:[0]){ g.beginPath(); P.forEach(([l,p],q)=>{ let ll2=l; if(wrap&&l<0&&off===0) ll2=l+2*Math.PI; if(wrap&&l>0&&off===1) ll2=l-2*Math.PI; q===0?g.moveTo(X(ll2),Y(p)):g.lineTo(X(ll2),Y(p)); }); g.closePath(); g.fill(); g.stroke(); } }
  if(ch==='flow'&&D.tipEdges&&D.tipEdges.length){ g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.2; for(const [a,b] of D.tipEdges){ const [l1,p1]=ll(a),[l2,p2]=ll(b); if(Math.abs(l1-l2)>Math.PI) continue; g.beginPath(); g.moveTo(X(l1),Y(p1)); g.lineTo(X(l2),Y(p2)); g.stroke(); g.fillStyle='rgba(0,0,0,0.7)'; g.beginPath(); g.arc(X(l2),Y(p2),2,0,7); g.fill(); } }
  for(const [u,color,lab] of marks(D)){ const [l,p]=ll(u); g.beginPath(); g.arc(X(l),Y(p),7,0,7); g.fillStyle=color; g.fill(); g.lineWidth=1.5; g.strokeStyle='#000'; g.stroke(); g.fillStyle='#000'; g.font='bold 9px sans-serif'; g.textAlign='center'; g.fillText(lab,X(l),Y(p)+3); g.textAlign='left'; }
  g.fillStyle='#fff'; g.font='bold 15px sans-serif'; const T={h:'h(u) (CoM height, blue low to red high)',grad:'|grad h| (lever arm; dark 0 to bright max '+D.gmax.toFixed(3)+')',flow:D.depth?'tipping depth of the nearest face (green = sink, purple = '+D.maxDepth+' tips away); black = tipping graph':'steepest-descent basin (colour) shaded by h'}[ch]; g.fillText(D.label+': '+T,8,20); g.font='12px sans-serif'; g.fillStyle='#aab2c4'; g.fillText(`equirectangular, lon -180..180, lat +90..-90; stable direction at (0,0). green S, red U, yellow saddle. h range ${D.hmin.toFixed(4)}..${D.hmax.toFixed(4)}`,8,38); return c.toDataURL('image/png'); }
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setSize(460,460); document.body.appendChild(renderer.domElement); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x10131a); const cam=new THREE.PerspectiveCamera(30,1,0.1,50);
export function globe(D,ch,views){ while(scene.children.length) scene.remove(scene.children[0]); const g=new THREE.BufferGeometry(); const pos=new Float32Array(3*D.V.length); D.V.forEach((v,i)=>{ const r=ch==='h'?1+2.2*(D.h[i]-D.hmin)/(D.hmax-D.hmin)*0.0:1; pos.set([v[0]*r,v[1]*r,v[2]*r],3*i); }); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(colors(D,ch),3)); g.setIndex(D.T.flat()); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true}))); for(const [u,color] of marks(D)){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.035,12,8),new THREE.MeshBasicMaterial({color})); m.position.set(...u).multiplyScalar(1.01); scene.add(m); const ring=new THREE.Mesh(new THREE.SphereGeometry(0.045,12,8),new THREE.MeshBasicMaterial({color:0x000000})); ring.position.copy(m.position); scene.add(ring); scene.add(m); }
  if(ch==='flow'&&D.tipEdges) for(const [a,b] of D.tipEdges){ const pts=[]; for(let k=0;k<=12;k++){ const t=k/12; const v=new THREE.Vector3(a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t,a[2]*(1-t)+b[2]*t).normalize().multiplyScalar(1.006); pts.push(v); } scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x000000}))); }
  const res=[]; for(const [nm,d] of views){ cam.position.set(...d).normalize().multiplyScalar(4); cam.up.set(0,0,1); if(Math.abs(d[2])>0.95) cam.up.set(0,1,0); cam.lookAt(0,0,0); renderer.render(scene,cam); res.push([nm,renderer.domElement.toDataURL('image/png')]); } return res; }
export function sheet(D,imgsByRow){ // imgsByRow: [{title,eq:dataURL, globes:[[name,dataURL]..]}]
}
window.M={equirect,globe}; window.READY=true;
</script></body></html>
